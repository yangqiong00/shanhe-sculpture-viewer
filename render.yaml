services:
  - type: web
    name: shanhe-sculpture-viewer
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: ADMIN_PASS
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: sculpture-data
      mountPath: /data
      sizeGB: 1
