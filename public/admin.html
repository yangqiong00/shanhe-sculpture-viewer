<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHANHE CRAFT | Admin Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: #f5f5f5; color: #333; min-height: 100vh; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px; background: #1a1a1a; color: #fff;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-left img { height: 32px; border-radius: 3px; }
  .header-left h1 { font-size: 16px; font-weight: 600; letter-spacing: 2px; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-right a { color: #FF6A00; text-decoration: none; font-size: 13px; }
  .btn-logout {
    background: none; border: 1px solid rgba(255,255,255,0.2); color: #aaa;
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .btn-logout:hover { border-color: #ff4444; color: #ff4444; }

  .container { max-width: 960px; margin: 0 auto; padding: 32px; }

  /* Login */
  .login-box {
    max-width: 400px; margin: 120px auto; background: #fff;
    border-radius: 16px; padding: 40px; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  .login-box h2 { font-size: 20px; margin-bottom: 8px; }
  .login-box p { font-size: 13px; color: #888; margin-bottom: 24px; }
  .login-box input {
    width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 15px; outline: none; font-family: inherit; margin-bottom: 16px;
  }
  .login-box input:focus { border-color: #FF6A00; }
  .login-box button {
    width: 100%; padding: 12px; background: #FF6A00; color: #fff; border: none;
    border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.2s;
  }
  .login-box button:hover { background: #e55d00; }
  .login-error { color: #ff4444; font-size: 13px; margin-top: 8px; display: none; }

  /* Dashboard */
  .dash-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
  }
  .dash-header h2 { font-size: 22px; font-weight: 600; }
  .btn-add {
    background: #FF6A00; color: #fff; border: none; padding: 10px 20px;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: background 0.2s;
  }
  .btn-add:hover { background: #e55d00; }

  /* Sculpture List */
  .sculpture-list { display: flex; flex-direction: column; gap: 12px; }
  .sculpture-item {
    background: #fff; border-radius: 12px; padding: 20px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: box-shadow 0.2s;
  }
  .sculpture-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .sculpture-icon {
    width: 60px; height: 60px; background: #f0f0f0; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    flex-shrink: 0;
  }
  .sculpture-info { flex: 1; }
  .sculpture-info h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .sculpture-info p { font-size: 12px; color: #888; }
  .sculpture-info .dims { color: #FF6A00; font-weight: 500; margin-top: 2px; }
  .sculpture-actions { display: flex; gap: 8px; }
  .btn-view {
    background: none; border: 1px solid #ddd; color: #666;
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    text-decoration: none; font-family: inherit; transition: all 0.2s;
  }
  .btn-view:hover { border-color: #FF6A00; color: #FF6A00; }
  .btn-delete {
    background: none; border: 1px solid #ddd; color: #999;
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .btn-edit {
    background: none; border: 1px solid #ddd; color: #666;
    padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .btn-edit:hover { border-color: #FF6A00; color: #FF6A00; }
  .btn-delete:hover { border-color: #ff4444; color: #ff4444; }

  .empty { text-align: center; padding: 60px; color: #aaa; }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000;
    display: none; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 32px;
    width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px; font-weight: 500; color: #666;
    margin-bottom: 6px;
  }
  .form-group input, .form-group textarea {
    width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus { border-color: #FF6A00; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .form-group .hint { font-size: 11px; color: #aaa; margin-top: 4px; }

  .file-drop {
    border: 2px dashed #ddd; border-radius: 12px; padding: 30px;
    text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .file-drop:hover, .file-drop.dragover { border-color: #FF6A00; background: #fff8f0; }
  .file-drop .icon { font-size: 36px; margin-bottom: 8px; }
  .file-drop p { font-size: 13px; color: #888; }
  .file-drop .filename { font-size: 14px; color: #FF6A00; font-weight: 500; margin-top: 8px; }
  .file-drop input { display: none; }

  .modal-actions { display: flex; gap: 12px; margin-top: 24px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-save { background: #FF6A00; color: #fff; border: none; }
  .btn-save:hover { background: #e55d00; }
  .btn-save:disabled { background: #ccc; cursor: not-allowed; }
  .btn-cancel { background: #fff; color: #666; border: 1px solid #ddd; }
  .btn-cancel:hover { border-color: #999; }

  .upload-progress {
    height: 4px; background: #eee; border-radius: 2px; margin-top: 8px; overflow: hidden;
    display: none;
  }
  .upload-progress .bar { height: 100%; background: #FF6A00; width: 0%; transition: width 0.3s; }

  .toast {
    position: fixed; top: 20px; right: 20px; z-index: 2000;
    background: #333; color: #fff; padding: 12px 20px; border-radius: 8px;
    font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: #ff4444; }
  .toast.success { background: #22c55e; }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .header { padding: 12px 16px; }
    .sculpture-item { flex-direction: column; align-items: flex-start; }
    .sculpture-actions { width: 100%; }
    .sculpture-actions .btn-view, .sculpture-actions .btn-edit, .sculpture-actions .btn-delete { flex: 1; text-align: center; }
  }
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ========== State ==========
let isAuthenticated = false;
let sculptures = [];

// ========== Init ==========
(async function init() {
  const authRes = await fetch('/api/auth');
  const authData = await authRes.json();
  isAuthenticated = authData.authenticated;
  if (isAuthenticated) {
    await loadSculptures();
    renderDashboard();
  } else {
    renderLogin();
  }
})();

// ========== Login ==========
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-box">
      <img src="/logo.jpg" alt="" style="height:48px;border-radius:4px;margin-bottom:16px;" onerror="this.style.display='none'">
      <h2>SHANHE CRAFT Admin</h2>
      <p>Enter password to manage sculptures</p>
      <input type="password" id="login-pass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
      <button onclick="doLogin()">Login</button>
      <div class="login-error" id="login-error"></div>
    </div>`;
  setTimeout(() => document.getElementById('login-pass')?.focus(), 100);
}

async function doLogin() {
  const pass = document.getElementById('login-pass').value;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    if (res.ok) {
      isAuthenticated = true;
      await loadSculptures();
      renderDashboard();
    } else {
      const err = await res.json();
      document.getElementById('login-error').textContent = err.error;
      document.getElementById('login-error').style.display = 'block';
    }
  } catch {
    document.getElementById('login-error').textContent = 'Network error';
    document.getElementById('login-error').style.display = 'block';
  }
}

// ========== Dashboard ==========
async function loadSculptures() {
  const res = await fetch('/api/sculptures');
  sculptures = await res.json();
}

function renderDashboard() {
  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-left">
        <img src="/logo.jpg" alt="" onerror="this.style.display='none'">
        <h1>SHANHE CRAFT</h1>
      </div>
      <div class="header-right">
        <a href="/" target="_blank">View Gallery →</a>
        <button class="btn-logout" onclick="doLogout()">Logout</button>
      </div>
    </div>
    <div class="container">
      <div class="dash-header">
        <h2>My Sculptures (${sculptures.length})</h2>
        <button class="btn-add" onclick="showAddModal()">+ Add Sculpture</button>
      </div>
      <div class="sculpture-list" id="sculpture-list"></div>
    </div>
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal-content"></div>
    </div>`;

  renderSculptureList();
}

function renderSculptureList() {
  const list = document.getElementById('sculpture-list');
  if (sculptures.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="icon">📦</div>
        <p>No sculptures yet. Click "Add Sculpture" to upload your first one.</p>
      </div>`;
    return;
  }

  list.innerHTML = sculptures.map(s => {
    const iconHtml = s.cover_image
      ? `<div class="sculpture-icon" style="background:url('/covers/${s.cover_image}') center/cover;border-radius:8px;"></div>`
      : `<div class="sculpture-icon">🗿</div>`;
    return `
    <div class="sculpture-item">
      ${iconHtml}
      <div class="sculpture-info">
        <h4>${escHtml(s.name)}</h4>
        <p>${escHtml(s.description || 'No description')}</p>
        <p class="dims">${s.default_width} × ${s.default_height} × ${s.default_depth} ${s.unit} | ${s.model_file.split('.').pop().toUpperCase()}</p>
      </div>
      <div class="sculpture-actions">
        <a class="btn-view" href="/viewer.html?id=${s.id}" target="_blank">View 3D</a>
        <button class="btn-edit" onclick="showEditModal(${s.id})">Edit</button>
        <button class="btn-delete" onclick="deleteSculpture(${s.id}, '${escHtml(s.name)}')">Delete</button>
      </div>
    </div>`;
  }).join('');
}

// ========== Add Sculpture Modal ==========
let uploadedFile = null;
let uploadedCover = null;
let extractedColor = '#f0f0f0';

function showAddModal() {
  uploadedFile = null;
  uploadedCover = null;
  extractedColor = '#f0f0f0';
  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-content').innerHTML = `
    <h3>Add New Sculpture</h3>
    <div class="form-group">
      <label>Sculpture Name *</label>
      <input type="text" id="f-name" placeholder="e.g. Abstract Wave Sculpture">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="f-desc" placeholder="Brief description of the sculpture (optional)"></textarea>
    </div>
    <div class="form-group">
      <label>Default Dimensions (cm) *</label>
      <div class="form-row">
        <div class="form-group">
          <input type="number" id="f-width" placeholder="Width" value="84">
          <div class="hint">Width</div>
        </div>
        <div class="form-group">
          <input type="number" id="f-height" placeholder="Height" value="225">
          <div class="hint">Height</div>
        </div>
        <div class="form-group">
          <input type="number" id="f-depth" placeholder="Depth" value="80">
          <div class="hint">Depth</div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>3D Model File *</label>
      <div class="file-drop" id="file-drop" onclick="document.getElementById('file-input').click()">
        <div class="icon">📁</div>
        <p>Click to select or drag & drop</p>
        <p style="font-size:11px;color:#bbb;margin-top:4px;">Supported: .obj, .fbx, .glb, .gltf, .stl (max 100MB)</p>
        <div class="filename" id="file-name"></div>
        <input type="file" id="file-input" accept=".obj,.fbx,.glb,.gltf,.stl" onchange="onFileSelect(this)">
      </div>
      <div class="upload-progress" id="upload-progress"><div class="bar" id="upload-bar"></div></div>
    </div>
    <div class="form-group">
      <label>Cover Photo (optional - shows as thumbnail & extracts color for 3D model)</label>
      <div class="file-drop" id="cover-drop" onclick="document.getElementById('cover-input').click()" style="padding:16px;">
        <div class="icon">🖼</div>
        <p>Upload finished product photo</p>
        <p style="font-size:11px;color:#bbb;margin-top:4px;">JPG, PNG, WebP</p>
        <div class="filename" id="cover-name"></div>
        <input type="file" id="cover-input" accept=".jpg,.jpeg,.png,.webp" onchange="onCoverSelect(this)">
      </div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px;">
        <span style="font-size:12px;color:#888;">Extracted color:</span>
        <div id="color-preview" style="width:24px;height:24px;border-radius:4px;background:#f0f0f0;border:1px solid #ddd;"></div>
        <input type="color" id="f-color" value="#f0f0f0" style="width:32px;height:24px;border:none;cursor:pointer;" onchange="extractedColor=this.value;document.getElementById('color-preview').style.background=this.value;">
        <span style="font-size:11px;color:#aaa;">(click to override)</span>
      </div>
    </div>
    <div class="form-group">
      <label>Model Rotation (adjust if model is sideways/upside down)</label>
      <div class="form-row">
        <div class="form-group">
          <input type="range" id="f-rotx" min="0" max="360" value="0" oninput="document.getElementById('rotx-val').textContent=this.value+'°'" style="width:100%;">
          <div class="hint">X-axis: <span id="rotx-val">0°</span></div>
        </div>
        <div class="form-group">
          <input type="range" id="f-roty" min="0" max="360" value="0" oninput="document.getElementById('roty-val').textContent=this.value+'°'" style="width:100%;">
          <div class="hint">Y-axis: <span id="roty-val">0°</span></div>
        </div>
        <div class="form-group">
          <input type="range" id="f-rotz" min="0" max="360" value="0" oninput="document.getElementById('rotz-val').textContent=this.value+'°'" style="width:100%;">
          <div class="hint">Z-axis: <span id="rotz-val">0°</span></div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="btn-save" onclick="saveSculpture()" disabled>Add Sculpture</button>
    </div>`;

  // Drag & drop for model
  const dropZone = document.getElementById('file-drop');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      document.getElementById('file-input').files = e.dataTransfer.files;
      onFileSelect(document.getElementById('file-input'));
    }
  });

  // Drag & drop for cover
  const coverDrop = document.getElementById('cover-drop');
  coverDrop.addEventListener('dragover', e => { e.preventDefault(); coverDrop.classList.add('dragover'); });
  coverDrop.addEventListener('dragleave', () => coverDrop.classList.remove('dragover'));
  coverDrop.addEventListener('drop', e => {
    e.preventDefault(); coverDrop.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      document.getElementById('cover-input').files = e.dataTransfer.files;
      onCoverSelect(document.getElementById('cover-input'));
    }
  });
}

function onCoverSelect(input) {
  if (input.files.length > 0) {
    const file = input.files[0];
    uploadedCover = file;
    document.getElementById('cover-name').textContent = `✓ ${file.name}`;
    // Extract dominant color
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 50; canvas.height = 50;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 50, 50);
        const data = ctx.getImageData(0, 0, 50, 50).data;
        let r = 0, g = 0, b = 0, count = 0;
        for (let i = 0; i < data.length; i += 16) {
          // Skip very dark and very light pixels
          const pr = data[i], pg = data[i+1], pb = data[i+2];
          const brightness = (pr + pg + pb) / 3;
          if (brightness > 30 && brightness < 240) {
            r += pr; g += pg; b += pb; count++;
          }
        }
        if (count > 0) {
          r = Math.round(r / count);
          g = Math.round(g / count);
          b = Math.round(b / count);
        } else {
          r = 200; g = 200; b = 200;
        }
        extractedColor = `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        document.getElementById('color-preview').style.background = extractedColor;
        document.getElementById('f-color').value = extractedColor;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

function onFileSelect(input) {
  if (input.files.length > 0) {
    const file = input.files[0];
    const ext = file.name.split('.').pop().toLowerCase();
    const allowed = ['obj', 'fbx', 'glb', 'gltf', 'stl'];
    if (!allowed.includes(ext)) {
      showToast(`Unsupported format: .${ext}. Use: ${allowed.map(e => '.'+e).join(', ')}`, 'error');
      return;
    }
    uploadedFile = file;
    document.getElementById('file-name').textContent = `✓ ${file.name} (${(file.size/1024/1024).toFixed(1)}MB)`;
    document.getElementById('btn-save').disabled = false;
  }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

async function saveSculpture() {
  const name = document.getElementById('f-name').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const width = parseFloat(document.getElementById('f-width').value) || 84;
  const height = parseFloat(document.getElementById('f-height').value) || 225;
  const depth = parseFloat(document.getElementById('f-depth').value) || 80;
  const rotX = parseFloat(document.getElementById('f-rotx')?.value) || 0;
  const rotY = parseFloat(document.getElementById('f-roty')?.value) || 0;
  const rotZ = parseFloat(document.getElementById('f-rotz')?.value) || 0;
  const color = document.getElementById('f-color')?.value || '#f0f0f0';

  if (!name) return showToast('Please enter a name', 'error');
  if (!uploadedFile) return showToast('Please select a 3D model file', 'error');

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Uploading...';

  const progressDiv = document.getElementById('upload-progress');
  const progressBar = document.getElementById('upload-bar');
  progressDiv.style.display = 'block';

  try {
    // Upload model and cover together
    const formData = new FormData();
    formData.append('model', uploadedFile);
    if (uploadedCover) formData.append('cover', uploadedCover);

    const uploadRes = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          progressBar.style.width = `${(e.loaded / e.total * 100).toFixed(0)}%`;
        }
      };
      xhr.onload = () => {
        if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
        else reject(new Error(JSON.parse(xhr.responseText).error));
      };
      xhr.onerror = () => reject(new Error('Upload failed'));
      xhr.send(formData);
    });

    // Create sculpture entry with all fields
    const createRes = await fetch('/api/sculptures', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, description: desc,
        model_file: uploadRes.model.filename,
        default_width: width, default_height: height, default_depth: depth,
        cover_image: uploadRes.cover?.filename || '',
        rotation_x: rotX, rotation_y: rotY, rotation_z: rotZ,
        model_color: color
      })
    });

    if (!createRes.ok) throw new Error((await createRes.json()).error);

    showToast('Sculpture added successfully!', 'success');
    closeModal();
    await loadSculptures();
    renderSculptureList();
  } catch (err) {
    showToast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Add Sculpture';
    progressDiv.style.display = 'none';
  }
}

// ========== Delete ==========
async function deleteSculpture(id, name) {
  if (!confirm(`Delete "${name}"? This will also delete the 3D model file.`)) return;
  try {
    await fetch(`/api/sculptures/${id}`, { method: 'DELETE' });
    showToast('Deleted', 'success');
    await loadSculptures();
    renderSculptureList();
  } catch {
    showToast('Delete failed', 'error');
  }
}

// ========== Edit Sculpture ==========
let editCoverFile = null;

function showEditModal(id) {
  const s = sculptures.find(x => x.id === id);
  if (!s) return;
  editCoverFile = null;

  document.getElementById('modal-overlay').classList.add('show');
  document.getElementById('modal-content').innerHTML = `
    <h3>Edit Sculpture</h3>
    <div class="form-group">
      <label>Sculpture Name</label>
      <input type="text" id="e-name" value="${escHtml(s.name)}">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="e-desc">${escHtml(s.description || '')}</textarea>
    </div>
    <div class="form-group">
      <label>Default Dimensions (cm)</label>
      <div class="form-row">
        <div class="form-group">
          <input type="number" id="e-width" value="${s.default_width}">
          <div class="hint">Width</div>
        </div>
        <div class="form-group">
          <input type="number" id="e-height" value="${s.default_height}">
          <div class="hint">Height</div>
        </div>
        <div class="form-group">
          <input type="number" id="e-depth" value="${s.default_depth}">
          <div class="hint">Depth</div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Model Rotation (adjust if model is sideways/upside down)</label>
      <div class="form-row">
        <div class="form-group">
          <input type="range" id="e-rotx" min="0" max="360" value="${s.rotation_x || 0}" oninput="document.getElementById('e-rotx-val').textContent=this.value+'°'" style="width:100%;">
          <div class="hint">X-axis: <span id="e-rotx-val">${s.rotation_x || 0}°</span></div>
        </div>
        <div class="form-group">
          <input type="range" id="e-roty" min="0" max="360" value="${s.rotation_y || 0}" oninput="document.getElementById('e-roty-val').textContent=this.value+'°'" style="width:100%;">
          <div class="hint">Y-axis: <span id="e-roty-val">${s.rotation_y || 0}°</span></div>
        </div>
        <div class="form-group">
          <input type="range" id="e-rotz" min="0" max="360" value="${s.rotation_z || 0}" oninput="document.getElementById('e-rotz-val').textContent=this.value+'°'" style="width:100%;">
          <div class="hint">Z-axis: <span id="e-rotz-val">${s.rotation_z || 0}°</span></div>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Model Color</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="color" id="e-color" value="${s.model_color || '#f0f0f0'}" style="width:48px;height:32px;border:none;cursor:pointer;">
        <span style="font-size:12px;color:#888;">Click to change color applied to 3D model</span>
      </div>
    </div>
    <div class="form-group">
      <label>Cover Photo ${s.cover_image ? '(current shown below, upload new to replace)' : '(optional)'}</label>
      ${s.cover_image ? `<div style="margin-bottom:8px;"><img src="/covers/${s.cover_image}" style="max-width:100%;max-height:120px;border-radius:8px;"></div>` : ''}
      <div class="file-drop" id="edit-cover-drop" onclick="document.getElementById('edit-cover-input').click()" style="padding:16px;">
        <div class="icon">🖼</div>
        <p>Upload new cover photo (optional)</p>
        <div class="filename" id="edit-cover-name"></div>
        <input type="file" id="edit-cover-input" accept=".jpg,.jpeg,.png,.webp" onchange="onEditCoverSelect(this)">
      </div>
    </div>
    <div style="background:#f8f8f8;border-radius:8px;padding:12px;margin-bottom:16px;">
      <div style="font-size:12px;color:#888;">Model file: <strong style="color:#555;">${escHtml(s.model_file)}</strong></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="btn-edit-save" onclick="saveEdit(${s.id})">Save Changes</button>
    </div>`;

  // Drag & drop for edit cover
  const coverDrop = document.getElementById('edit-cover-drop');
  coverDrop.addEventListener('dragover', e => { e.preventDefault(); coverDrop.classList.add('dragover'); });
  coverDrop.addEventListener('dragleave', () => coverDrop.classList.remove('dragover'));
  coverDrop.addEventListener('drop', e => {
    e.preventDefault(); coverDrop.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      document.getElementById('edit-cover-input').files = e.dataTransfer.files;
      onEditCoverSelect(document.getElementById('edit-cover-input'));
    }
  });
}

function onEditCoverSelect(input) {
  if (input.files.length > 0) {
    editCoverFile = input.files[0];
    document.getElementById('edit-cover-name').textContent = `✓ ${editCoverFile.name}`;
  }
}

async function saveEdit(id) {
  const btn = document.getElementById('btn-edit-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    let coverImage = undefined;

    // Upload new cover if selected
    if (editCoverFile) {
      const formData = new FormData();
      formData.append('cover', editCoverFile);
      const uploadRes = await fetch('/api/upload-cover', { method: 'POST', body: formData }).then(r => r.json());
      if (uploadRes.filename) coverImage = uploadRes.filename;
    }

    const body = {
      name: document.getElementById('e-name').value.trim(),
      description: document.getElementById('e-desc').value.trim(),
      default_width: parseFloat(document.getElementById('e-width').value) || 84,
      default_height: parseFloat(document.getElementById('e-height').value) || 225,
      default_depth: parseFloat(document.getElementById('e-depth').value) || 80,
      rotation_x: parseFloat(document.getElementById('e-rotx').value) || 0,
      rotation_y: parseFloat(document.getElementById('e-roty').value) || 0,
      rotation_z: parseFloat(document.getElementById('e-rotz').value) || 0,
      model_color: document.getElementById('e-color').value || '#f0f0f0'
    };

    if (coverImage !== undefined) body.cover_image = coverImage;

    const res = await fetch(`/api/sculptures/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error((await res.json()).error);

    showToast('Sculpture updated!', 'success');
    closeModal();
    await loadSculptures();
    renderSculptureList();
  } catch (err) {
    showToast(err.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
}

// ========== Logout ==========
async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  isAuthenticated = false;
  renderLogin();
}

// ========== Utils ==========
function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
