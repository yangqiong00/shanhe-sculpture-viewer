<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHANHE CRAFT | 3D Sculpture Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e8e8e8; overflow: hidden; height: 100vh; }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: rgba(10,10,10,0.9);
    backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .topbar-left img { height: 32px; border-radius: 3px; }
  .topbar-left .brand { font-size: 14px; font-weight: 600; letter-spacing: 2px; }
  .topbar-left .sep { color: #444; margin: 0 4px; }
  .topbar-left .title { font-size: 14px; color: #aaa; font-weight: 400; }
  .btn-back {
    background: none; border: 1px solid rgba(255,255,255,0.15); color: #aaa;
    padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
    text-decoration: none; transition: all 0.2s;
  }
  .btn-back:hover { border-color: #FF6A00; color: #FF6A00; }
  #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  #canvas-container canvas { display: block; }
  .panel {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 100; background: rgba(20,20,20,0.92);
    backdrop-filter: blur(24px); border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    padding: 20px 28px; min-width: 360px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .panel-title { font-size: 11px; font-weight: 600; color: #666; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 14px; }
  .dim-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .dim-row label { width: 50px; font-size: 13px; color: #888; font-weight: 500; }
  .dim-row input {
    flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 8px 12px; color: #fff; font-size: 15px;
    font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s;
  }
  .dim-row input:focus { border-color: #FF6A00; }
  .dim-row .unit { font-size: 13px; color: #666; width: 24px; }
  .dim-row.lock { justify-content: flex-end; gap: 8px; }
  .lock-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 6px 14px; color: #aaa; font-size: 12px;
    cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
  }
  .lock-btn.active { border-color: #FF6A00; color: #FF6A00; background: rgba(255,106,0,0.08); }
  .reset-btn {
    background: none; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; padding: 6px 14px; color: #888; font-size: 12px;
    cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
  }
  .reset-btn:hover { border-color: #FF6A00; color: #FF6A00; }
  .info-badge {
    position: fixed; top: 70px; right: 20px; z-index: 100;
    background: rgba(20,20,20,0.9); backdrop-filter: blur(16px);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);
    padding: 16px 20px; font-size: 12px; color: #888; line-height: 1.8;
  }
  .info-badge .label { color: #555; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .info-badge .value { color: #ddd; font-weight: 500; }
  .loading-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0a; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 200;
    transition: opacity 0.5s;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,106,0,0.2); border-top-color: #FF6A00; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { margin-top: 16px; font-size: 14px; color: #666; }
  .hint {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 90; background: rgba(255,106,0,0.15); border: 1px solid rgba(255,106,0,0.3);
    border-radius: 12px; padding: 12px 20px; font-size: 13px; color: #FF6A00;
    pointer-events: none; opacity: 0; transition: opacity 0.5s;
  }
  .hint.show { opacity: 1; }
  @media (max-width: 768px) {
    .topbar { padding: 10px 16px; }
    .topbar-left .title { display: none; }
    .panel { min-width: auto; left: 10px; right: 10px; transform: none; bottom: 10px; padding: 16px; }
    .info-badge { top: 60px; right: 10px; padding: 10px 14px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-text">Loading 3D Model...</div>
</div>
<div class="hint" id="hint">🖱 Drag to rotate · Scroll to zoom · Right-click to pan</div>
<div class="topbar">
  <div class="topbar-left">
    <img src="/logo.jpg" alt="" onerror="this.style.display='none'">
    <span class="brand">SHANHE CRAFT</span>
    <span class="sep">/</span>
    <span class="title" id="sculpture-name">Loading...</span>
  </div>
  <a href="/" class="btn-back">← Gallery</a>
</div>
<div id="canvas-container"></div>
<div class="info-badge" id="info-badge" style="display:none;">
  <div><span class="label">Current Size</span></div>
  <div><span class="value" id="info-size">—</span></div>
  <div style="margin-top:8px;"><span class="label">Scale</span></div>
  <div><span class="value" id="info-scale">100%</span></div>
</div>
<div class="panel" id="panel" style="display:none;">
  <div class="panel-title">Adjust Dimensions</div>
  <div class="dim-row"><label>Width</label><input type="number" id="dim-w" step="1" min="1"><span class="unit">cm</span></div>
  <div class="dim-row"><label>Height</label><input type="number" id="dim-h" step="1" min="1"><span class="unit">cm</span></div>
  <div class="dim-row"><label>Depth</label><input type="number" id="dim-d" step="1" min="1"><span class="unit">cm</span></div>
  <div class="dim-row lock">
    <button class="lock-btn active" id="lock-btn" onclick="toggleLock()">🔒 Proportional</button>
    <button class="reset-btn" onclick="resetDimensions()">↺ Reset</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

let scene, camera, renderer, controls;
let modelGroup = null;
let humanGroup = null;
let gridHelper = null;
let originalBox = null;
let dimLines = { width: null, height: null, depth: null };
let defaultDims = { w: 84, h: 225, d: 80 };
let currentScale = 1.0;
let lockProportional = true;
let sculptureData = null;

const urlParams = new URLSearchParams(window.location.search);
const sculptureId = urlParams.get('id');

if (!sculptureId) {
  document.getElementById('loading').innerHTML = '<p style="color:#888">No sculpture selected. <a href="/" style="color:#FF6A00">Go to gallery</a></p>';
} else {
  initScene();
  loadSculpture(sculptureId);
}

function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);
  scene.fog = new THREE.FogExp2(0x111111, 0.012);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(5, 3, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // Controls - NO polar angle limit, full 360° including bottom
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.5;
  controls.maxDistance = 100;
  controls.target.set(0, 1.5, 0);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir1 = new THREE.DirectionalLight(0xffffff, 1.2);
  dir1.position.set(5, 8, 5); dir1.castShadow = true;
  dir1.shadow.mapSize.set(2048, 2048);
  scene.add(dir1);
  scene.add(new THREE.DirectionalLight(0x8888ff, 0.4).translateX(-3).translateY(4).translateZ(-3));
  scene.add(new THREE.DirectionalLight(0xff8844, 0.3).translateY(2).translateZ(-5));

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(100, 100),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9, metalness: 0.1 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  gridHelper = new THREE.GridHelper(20, 20, 0x333333, 0x222222);
  gridHelper.position.y = 0.005;
  scene.add(gridHelper);

  humanGroup = createHumanFigure(1.75);
  humanGroup.position.set(3, 0, 0);
  scene.add(humanGroup);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  setTimeout(() => {
    const hint = document.getElementById('hint');
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 3000);
  }, 1500);
}

// ========== Human Figure ==========
function createHumanFigure(height) {
  const g = new THREE.Group();
  const m = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6, metalness: 0.1 });
  const s = height / 1.75;

  const parts = [
    [new THREE.SphereGeometry(0.1*s,16,16), [0, 1.62*s, 0]],
    [new THREE.CylinderGeometry(0.04*s,0.05*s,0.08*s,8), [0, 1.49*s, 0]],
    [new THREE.CylinderGeometry(0.18*s,0.16*s,0.35*s,8), [0, 1.28*s, 0]],
    [new THREE.CylinderGeometry(0.16*s,0.14*s,0.25*s,8), [0, 0.98*s, 0]],
  ];
  parts.forEach(([geo, pos]) => {
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.set(...pos); mesh.castShadow = true; g.add(mesh);
  });

  [-1, 1].forEach(side => {
    [[0.035*s,0.03*s,0.3*s, side*0.22*s,1.22*s,0, side*0.15],
     [0.03*s,0.025*s,0.28*s, side*0.26*s,0.93*s,0, side*0.08],
     [0.06*s,0.05*s,0.42*s, side*0.08*s,0.64*s,0, 0],
     [0.045*s,0.035*s,0.42*s, side*0.08*s,0.22*s,0, 0]].forEach(([rt,rb,h,x,y,z,rz]) => {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,8), m);
      mesh.position.set(x,y,z); mesh.rotation.z = rz||0; mesh.castShadow = true; g.add(mesh);
    });
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.08*s,0.04*s,0.16*s), m);
    foot.position.set(side*0.08*s, 0.02*s, 0.03*s); g.add(foot);
  });

  // Height label
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#888888'; ctx.font = 'bold 28px Inter, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${height.toFixed(2)}m`, 128, 40);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.position.y = height + 0.2; sp.scale.set(0.8, 0.2, 1); g.add(sp);
  return g;
}

// ========== Dimension Annotation Lines ==========
function createDimLine(color = 0xff2222) {
  const group = new THREE.Group();
  const lineMat = new THREE.LineBasicMaterial({ color, linewidth: 2 });

  // Main line
  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, 0, 0)
  ]);
  const line = new THREE.Line(lineGeo, lineMat);
  group.add(line);

  // Endpoint ticks
  const tickSize = 0.05;
  const tick1Geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -tickSize, 0), new THREE.Vector3(0, tickSize, 0)
  ]);
  const tick2Geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(1, -tickSize, 0), new THREE.Vector3(1, tickSize, 0)
  ]);
  group.add(new THREE.Line(tick1Geo, lineMat));
  group.add(new THREE.Line(tick2Geo, lineMat));

  // Arrowheads
  const arrowMat = new THREE.MeshBasicMaterial({ color });
  const arrow1 = new THREE.Mesh(new THREE.ConeGeometry(tickSize*0.8, tickSize*3, 8), arrowMat);
  arrow1.rotation.z = Math.PI / 2; arrow1.position.set(tickSize*1.5, 0, 0);
  group.add(arrow1);
  const arrow2 = new THREE.Mesh(new THREE.ConeGeometry(tickSize*0.8, tickSize*3, 8), arrowMat);
  arrow2.rotation.z = -Math.PI / 2; arrow2.position.set(1 - tickSize*1.5, 0, 0);
  group.add(arrow2);

  // Text label sprite
  const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(1, 0.25, 1);
  sprite.position.y = 0.12;
  group.add(sprite);

  group.userData = { line, lineGeo, tick1Geo, tick2Geo, arrow1, arrow2, sprite, canvas, ctx, texture };
  return group;
}

function updateDimLine(dimGroup, length, label, axis) {
  const d = dimGroup.userData;
  const len = Math.max(length, 0.01);

  // Update line geometry
  d.lineGeo.setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(len, 0, 0)]);
  d.tick1Geo.setFromPoints([new THREE.Vector3(0, -0.05*len, 0), new THREE.Vector3(0, 0.05*len, 0)]);
  d.tick2Geo.setFromPoints([new THREE.Vector3(len, -0.05*len, 0), new THREE.Vector3(len, 0.05*len, 0)]);

  const tk = 0.03 * len;
  d.arrow1.scale.set(tk, tk, tk);
  d.arrow1.position.set(tk * 1.5, 0, 0);
  d.arrow2.scale.set(tk, tk, tk);
  d.arrow2.position.set(len - tk * 1.5, 0, 0);

  // Update label
  const { ctx: c, canvas: cv, texture: tex } = d;
  c.clearRect(0, 0, 512, 128);
  c.fillStyle = '#ff2222';
  c.font = 'bold 48px Inter, sans-serif';
  c.textAlign = 'center';
  c.fillText(label, 256, 72);
  tex.needsUpdate = true;

  d.sprite.position.set(len / 2, len * 0.08, 0);
  const labelScale = Math.max(len * 0.4, 0.3);
  d.sprite.scale.set(labelScale, labelScale * 0.25, 1);
}

function initDimLines() {
  // Remove old
  Object.values(dimLines).forEach(g => { if (g) scene.remove(g); });

  dimLines.width = createDimLine(0xff2222);
  dimLines.height = createDimLine(0xff2222);
  dimLines.depth = createDimLine(0xff2222);

  // Height line is vertical - rotate it
  dimLines.height.rotation.z = Math.PI / 2;

  scene.add(dimLines.width);
  scene.add(dimLines.height);
  scene.add(dimLines.depth);
}

function repositionDimLines() {
  if (!modelGroup) return;

  const box = new THREE.Box3().setFromObject(modelGroup);
  const size = new THREE.Vector3();
  box.getSize(size);
  const min = box.min;
  const offset = size.y * 0.08;

  // Width (X axis) - along the front bottom
  dimLines.width.position.set(min.x, 0, min.z - offset);

  // Height (Y axis) - along the left side
  dimLines.height.position.set(min.x - offset, 0, min.z - offset);

  // Depth (Z axis) - along the bottom left
  dimLines.depth.rotation.y = Math.PI / 2;
  dimLines.depth.position.set(min.x - offset, 0, min.z);
}

function updateAllDimLines() {
  const w = parseFloat(document.getElementById('dim-w').value) || 0;
  const h = parseFloat(document.getElementById('dim-h').value) || 0;
  const d = parseFloat(document.getElementById('dim-d').value) || 0;

  // Convert cm to meters for display
  const wM = w / 100;
  const hM = h / 100;
  const dM = d / 100;

  // Format labels
  const fmtCm = (v) => v >= 100 ? `${(v/100).toFixed(2)}m` : `${Math.round(v)}cm`;
  updateDimLine(dimLines.width, wM, fmtCm(w), 'x');
  updateDimLine(dimLines.height, hM, fmtCm(h), 'y');
  updateDimLine(dimLines.depth, dM, fmtCm(d), 'z');

  repositionDimLines();
}

// ========== Load Sculpture ==========
async function loadSculpture(id) {
  try {
    const res = await fetch(`/api/sculptures/${id}`);
    if (!res.ok) throw new Error('Sculpture not found');
    sculptureData = await res.json();

    document.getElementById('sculpture-name').textContent = sculptureData.name;
    document.title = `SHANHE CRAFT | ${sculptureData.name}`;
    defaultDims = {
      w: sculptureData.default_width || 84,
      h: sculptureData.default_height || 225,
      d: sculptureData.default_depth || 80
    };

    document.getElementById('dim-w').value = defaultDims.w;
    document.getElementById('dim-h').value = defaultDims.h;
    document.getElementById('dim-d').value = defaultDims.d;

    const modelUrl = `/models/${sculptureData.model_file}`;
    const ext = sculptureData.model_file.split('.').pop().toLowerCase();
    await loadModel(modelUrl, ext);

    // Init dimension lines
    initDimLines();
    updateAllDimLines();

    document.getElementById('loading').classList.add('hidden');
    document.getElementById('panel').style.display = '';
    document.getElementById('info-badge').style.display = '';

    ['dim-w', 'dim-h', 'dim-d'].forEach(id => {
      document.getElementById(id).addEventListener('input', onDimensionChange);
    });
  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<p style="color:#ff4444">Error: ${err.message}</p><p style="color:#888;margin-top:8px"><a href="/" style="color:#FF6A00">Back to gallery</a></p>`;
  }
}

async function loadModel(url, ext) {
  const loadingManager = new THREE.LoadingManager();
  const modelColor = sculptureData?.model_color || '#f0f0f0';
  const rotX = (sculptureData?.rotation_x || 0) * Math.PI / 180;
  const rotY = (sculptureData?.rotation_y || 0) * Math.PI / 180;
  const rotZ = (sculptureData?.rotation_z || 0) * Math.PI / 180;

  return new Promise((resolve, reject) => {
    const onLoad = (obj) => {
      if (modelGroup) scene.remove(modelGroup);
      modelGroup = new THREE.Group();

      // Apply saved rotation
      obj.rotation.set(rotX, rotY, rotZ);

      // Apply material color
      const color = new THREE.Color(modelColor);
      if (ext === 'obj' || ext === 'stl') {
        obj.traverse(child => {
          if (child.isMesh) {
            child.material = new THREE.MeshStandardMaterial({ color, roughness: 0.4, metalness: 0.05 });
            child.castShadow = true; child.receiveShadow = true;
          }
        });
      }
      if (ext === 'fbx') {
        obj.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true; child.receiveShadow = true;
            if (child.material) { child.material.color = color; child.material.side = THREE.DoubleSide; }
          }
        });
      }
      if (ext === 'glb' || ext === 'gltf') {
        obj.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true; child.receiveShadow = true;
            // For GLB with existing materials, tint them
            if (child.material && child.material.color) {
              child.material.color.lerp(color, 0.5);
            }
          }
        });
      }

      modelGroup.add(obj);

      // Compute bounding box AFTER rotation
      const box = new THREE.Box3().setFromObject(modelGroup);
      const size = new THREE.Vector3();
      box.getSize(size);
      originalBox = { size: size.clone() };

      const scaleX = (defaultDims.w / 100) / size.x;
      const scaleY = (defaultDims.h / 100) / size.y;
      const scaleZ = (defaultDims.d / 100) / size.z;
      const avgScale = (scaleX + scaleY + scaleZ) / 3;
      modelGroup.scale.set(avgScale, avgScale, avgScale);
      currentScale = avgScale;

      // Center on ground
      const scaledBox = new THREE.Box3().setFromObject(modelGroup);
      const sc = new THREE.Vector3(); scaledBox.getCenter(sc);
      modelGroup.position.x -= sc.x;
      modelGroup.position.z -= sc.z;
      modelGroup.position.y -= scaledBox.min.y;

      // Position human
      const finalBox = new THREE.Box3().setFromObject(modelGroup);
      const finalSize = new THREE.Vector3(); finalBox.getSize(finalSize);
      humanGroup.position.x = finalSize.x / 2 + 1.5;
      humanGroup.position.z = 0;

      // Camera
      const maxDim = Math.max(finalSize.x, finalSize.y, finalSize.z);
      const camDist = maxDim * 2.5;
      camera.position.set(camDist * 0.7, maxDim * 0.6, camDist * 0.7);
      controls.target.set(0, finalSize.y * 0.4, 0);
      controls.update();

      // Grid
      const gridSize = Math.ceil(maxDim * 4);
      scene.remove(gridHelper);
      gridHelper = new THREE.GridHelper(gridSize, Math.min(gridSize * 2, 40), 0x333333, 0x222222);
      gridHelper.position.y = 0.005;
      scene.add(gridHelper);

      scene.add(modelGroup);
      updateInfoDisplay();
      resolve();
    };

    const onError = (err) => reject(err);

    if (ext === 'obj') new OBJLoader(loadingManager).load(url, onLoad, undefined, onError);
    else if (ext === 'fbx') new FBXLoader(loadingManager).load(url, onLoad, undefined, onError);
    else if (ext === 'glb' || ext === 'gltf') new GLTFLoader(loadingManager).load(url, g => onLoad(g.scene), undefined, onError);
    else if (ext === 'stl') new STLLoader(loadingManager).load(url, geo => onLoad(new THREE.Mesh(geo)), undefined, onError);
    else reject(new Error(`Unsupported: .${ext}`));
  });
}

// ========== Dimension Controls ==========
function onDimensionChange(e) {
  if (!modelGroup || !originalBox) return;
  const wVal = parseFloat(document.getElementById('dim-w').value) || defaultDims.w;
  const hVal = parseFloat(document.getElementById('dim-h').value) || defaultDims.h;
  const dVal = parseFloat(document.getElementById('dim-d').value) || defaultDims.d;

  if (lockProportional) {
    let nW = wVal, nH = hVal, nD = dVal;
    if (e.target.id === 'dim-h') {
      const r = hVal / defaultDims.h;
      nW = Math.round(defaultDims.w * r); nD = Math.round(defaultDims.d * r);
      document.getElementById('dim-w').value = nW; document.getElementById('dim-d').value = nD;
    } else if (e.target.id === 'dim-w') {
      const r = wVal / defaultDims.w;
      nH = Math.round(defaultDims.h * r); nD = Math.round(defaultDims.d * r);
      document.getElementById('dim-h').value = nH; document.getElementById('dim-d').value = nD;
    } else if (e.target.id === 'dim-d') {
      const r = dVal / defaultDims.d;
      nW = Math.round(defaultDims.w * r); nH = Math.round(defaultDims.h * r);
      document.getElementById('dim-w').value = nW; document.getElementById('dim-h').value = nH;
    }
    applyScale(nW, nH, nD);
  } else {
    applyScale(wVal, hVal, dVal);
  }
}

function applyScale(w, h, d) {
  if (!modelGroup || !originalBox) return;
  const size = originalBox.size;
  const sx = (w / 100) / size.x, sy = (h / 100) / size.y, sz = (d / 100) / size.z;
  modelGroup.scale.set(sx, sy, sz);
  const box = new THREE.Box3().setFromObject(modelGroup);
  modelGroup.position.y -= box.min.y;
  const fs = new THREE.Vector3(); box.getSize(fs);
  humanGroup.position.x = fs.x / 2 + 1.5;
  currentScale = (sx + sy + sz) / 3;
  updateInfoDisplay();
  updateAllDimLines();
}

function updateInfoDisplay() {
  const w = parseFloat(document.getElementById('dim-w').value);
  const h = parseFloat(document.getElementById('dim-h').value);
  const d = parseFloat(document.getElementById('dim-d').value);
  document.getElementById('info-size').textContent = `${w} × ${h} × ${d} cm`;
  const base = (defaultDims.w + defaultDims.h + defaultDims.d) / 3;
  const cur = (w + h + d) / 3;
  document.getElementById('info-scale').textContent = `${Math.round((cur / base) * 100)}%`;
}

window.toggleLock = function() {
  lockProportional = !lockProportional;
  const btn = document.getElementById('lock-btn');
  btn.classList.toggle('active', lockProportional);
  btn.textContent = lockProportional ? '🔒 Proportional' : '🔓 Free Scale';
};

window.resetDimensions = function() {
  document.getElementById('dim-w').value = defaultDims.w;
  document.getElementById('dim-h').value = defaultDims.h;
  document.getElementById('dim-d').value = defaultDims.d;
  applyScale(defaultDims.w, defaultDims.h, defaultDims.d);
  if (modelGroup) {
    const box = new THREE.Box3().setFromObject(modelGroup);
    const size = new THREE.Vector3(); box.getSize(size);
    const cd = Math.max(size.x, size.y, size.z) * 2.5;
    camera.position.set(cd * 0.7, size.y * 0.6, cd * 0.7);
    controls.target.set(0, size.y * 0.4, 0);
    controls.update();
  }
};
